<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project 0: Becoming Friends with Your Camera</title>
    
    <!-- Fixed Google Fonts Connections -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,300;0,400;0,700;1,300&display=swap" rel="stylesheet">
    
    <!-- External Stylesheet -->
    <link rel="stylesheet" href="../style.css">
</head>
<body>

    <!-- Unified Container Layout Framework -->
    <main class="container">
        
        <!-- Matched Header Layout Structure -->
        <header class="portfolio-hero">
            <h1>Project 0: <span class="highlight">Becoming Friends with Your Camera</span></h1>
            <p class="subtitle">Name: HOW En Hsin | Student ID: 3043225474</p>
        </header>

        <!-- Part 1 -->
        <section class="project-part">
            <h2>Part 1: Selfies</h2>
            <figure class="media-container">
                <img src="./media/selfies.png" alt="Selfies collection">
            </figure>
        </section>

        <!-- Part 2 -->
        <section class="project-part">
            <h2>Part 2: Far vs Near</h2>
            <div class="grid">
                <figure class="media-container">
                    <h3>Bancroft Doe Library</h3>
                    <img src="./media/bancroft.png" alt="Bancroft Doe Library">
                </figure>
                <figure class="media-container">
                    <h3>The Campanile</h3>
                    <img src="./media/campanile.png" alt="The Campanile">
                </figure>
            </div>
        </section>

        <!-- Part 3 -->
        <section class="project-part">
            <h2>Part 3: Dolly Zoom</h2>
            <div class="grid">
                <figure class="media-container">
                    <h3>Bicycle</h3>
                    <img src="./media/bike_dolly.gif" alt="Bicycle dolly zoom animation">
                </figure>
                <figure class="media-container">
                    <h3>Lampost</h3>
                    <img src="./media/lampost_dolly.gif" alt="Lampost dolly zoom animation">
                </figure>
            </div>
        </section>
    </main>

</body>
</html>
